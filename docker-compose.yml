services:
  bot:
    build: .
    image: bad_words_bot:latest
    container_name: bad_words_bot
    restart: unless-stopped

    # Load secrets from .env file (never committed to git)
    env_file:
      - .env

    # Mount editable files so changes are picked up without rebuilding the image
    volumes:
      - ./bad_words.txt:/app/bad_words.txt:ro
      - ./dictionaries:/app/dictionaries:ro
      - ./config.yaml:/app/config.yaml:ro

    # Structured JSON logs are written to stdout — Docker captures them
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
